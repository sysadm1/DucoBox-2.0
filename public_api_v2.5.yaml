components:
    schemas:
        Api: 
            type: object
            properties:
                PublicApiVersion: 
                    type: object
                    properties:
                        Val: 
                            type: string
                            example: "2.4"
                ApiInfo:  
                    description: API information
                    type: array
                    items:
                        type: object
                        properties:
                          Url:
                            type: string
                            example: "/info"
                          QueryParameters:
                            type: array
                            items:
                              type: string
                              example: "module"
                          Methods:
                              type: array
                              items:
                                type: string
                                example: "GET"
                                enum: [GET, PATCH, POST, PUT, DELETE]
                          Modules:
                              type: array
                              items:
                                type: string
                                example: "General"

        Info: 
            type: object
            properties:
                General: 
                    description: General info
                    type: object
                    properties:
                        Board: 
                            description: Board info
                            type: object
                            properties:
                                PublicApiVersion:  
                                    allOf:
                                      - $ref: '#/components/schemas/InfoValueString'
                                      - example: {"Val":"2.0","Id":0}
                                BoxName: 
                                    allOf:
                                      - $ref: '#/components/schemas/InfoValueString'
                                      - example: {"Val":"FOCUS","Id":0}
                                BoxSubTypeName: 
                                    allOf:
                                      - $ref: '#/components/schemas/InfoValueString'
                                      - example: {"Val":"Eu","Id":0}
                                SerialBoardComm: 
                                    allOf:
                                      - $ref: '#/components/schemas/InfoValueString'
                                      - example: {"Val":"RS123456789","Id":0}
                                SerialBoardBox: 
                                    allOf:
                                      - $ref: '#/components/schemas/InfoValueString'
                                      - example: {"Val":"RS123456789","Id":0}
                                SerialDucoBox: 
                                    allOf:
                                      - $ref: '#/components/schemas/InfoValueString'
                                      - example: {"Val":"P1234567-221101-123","Id":0}
                                SerialDucoComm: 
                                    allOf:
                                      - $ref: '#/components/schemas/InfoValueString'
                                      - example: {"Val":"P1234567-221101-123","Id":0}
                                Time: 
                                    allOf:
                                      - $ref: '#/components/schemas/InfoValue'
                                      - example: {"Val":1652774661,"Id":0}
                        Lan: 
                            description: Network info
                            type: object
                            properties:
                                Mode: 
                                    type: object
                                    properties:
                                        Val:
                                            type: string
                                            example: "ETHERNET"
                                            enum: [NO_CONNECTION, WIFI_AP, WIFI_CLIENT, ETHERNET]
                                        Id: 
                                            type: integer
                                Ip: 
                                    allOf:
                                      - $ref: '#/components/schemas/InfoValueString'
                                      - example: {"Val":"192.168.4.1","Id":0}
                                NetMask: 
                                    allOf:
                                      - $ref: '#/components/schemas/InfoValueString'
                                      - example: {"Val":"255.255.255.0","Id":0}
                                DefaultGateway: 
                                    allOf:
                                      - $ref: '#/components/schemas/InfoValueString'
                                      - example: {"Val":"192.168.4.1","Id":0}
                                Dns: 
                                    allOf:
                                      - $ref: '#/components/schemas/InfoValueString'
                                      - example: {"Val":"8.8.8.8","Id":0}
                                Mac: 
                                    allOf:
