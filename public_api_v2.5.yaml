openapi: "3.0.3"

info:
    version: "2.5" 
    title: DucoDevice API
    description: 
        "
            This document describes the Ethernet interface used on the Duco devices. 
            \ The interface is based upon JSON structures that can be retrieved using HTTP requests.
            \ Version numbering can be added in the URL, but calls without the versioning will be redirected to the latest version.
            \n 1. Public API: Open for everyone
                \n  - Use HTTP or HTTPS
        "

servers:
    -   url: '{protocol}://{ipaddress}/'
        description: By IP-address
        variables:
            ipaddress:
                default: "192.168.0.1"
                description: IP-address
            protocol:
                default: "http"
                description: protocol
                enum:
                  - 'http'
                  - 'https'
    -   url: '{protocol}://{ipaddress}/v2/'
        description: By IP-address
        variables:
            ipaddress:
                default: "192.168.0.1"
                description: IP-address
            protocol:
                default: "http"
                description: protocol
                enum:
                  - 'http'
                  - 'https'
    -   url: '{protocol}://duco_{MACaddress}.local/'
        description: By mDNS hostname
        variables:
            MACaddress:
                default: "123ABC"
                description: Last six values of MAC address    
            protocol:
                default: "http"
                description: protocol
                enum:
                  - 'http'
                  - 'https'
    -   url: '{protocol}://duco_{MACaddress}.local/v2/'
        description: By mDNS hostname
        variables:
            MACaddress:
                default: "123ABC"
                description: Last six values of MAC address
            protocol:
                default: "http"
                description: protocol
                enum:
                  - 'http'
                  - 'https'
                
tags:
    - name: Api       
    - name: Nodes     
    - name: Info      
    - name: Config    
    - name: Action    
paths:
    /api: 
        get: 
            summary: Api Info 
            operationId: ApiGet 
            tags: 
                -   Api
            responses: 
                '200':
                    description: Info    
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Api"
                '400':
                    $ref: "#/components/responses/BadRequestError"
                '401':
                    $ref: "#/components/responses/UnauthorizedError"
                '404':
                    $ref: "#/components/responses/NotFoundError"
    
    /info: 
        get: 
            summary: System info 
            operationId: InfoGet 
            tags: 
                -   Info
            parameters: 
                -   name: module 
                    in: query
                    description: Optional modulename. When omitted, all info is returned if possible. Multiple selection possible with comma seperation.
                    schema:
                        type: array
                        items:
                            type: string
                -   name: submodule 
                    in: query
                    description: Optional submodulename. When omitted, all info is returned if possible. Multiple selection possible with comma seperation.
                    schema:
                        type: string
                -   name: parameter 
                    in: query
                    description: Optional submodulename. When omitted, all info is returned if possible. Multiple selection possible with comma seperation.
                    schema:
                        type: string
            responses: 
                '200':
                    description: Info
                    content:
